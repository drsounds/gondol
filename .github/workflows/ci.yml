name: CI

on:
  # Automatic runs on pull requests and pushes are turned off; run the checks by hand with
  # "Run workflow" in the Actions tab.
  workflow_dispatch:

jobs:
  check:
    name: Exports, manifest schema, lint, typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile
      - run: bun run check-exports
      - run: bun run check-manifest-schema
      - run: bun run lint
      - run: bun run test
      #- run: bun run typecheck
